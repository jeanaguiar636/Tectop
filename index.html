<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tectop - Atendimento Exclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#020617">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-24" x-data="appData()" x-init="initApp()">

    <!-- Topo / Marca Dinâmica -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 rounded-xl text-slate-950 font-black flex items-center justify-center shadow-md" :style="'background-color: ' + config.corPrimaria">
                <i class="fa-solid fa-screwdriver-wrench text-base"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white" x-text="config.nomeEmpresa"></h1>
                <p class="text-[11px] font-medium flex items-center" :style="'color: ' + config.corPrimaria">
                    <span class="w-2 h-2 rounded-full animate-pulse mr-1" :style="'background-color: ' + config.corPrimaria"></span> Atendimento Autorizado
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button @click="alternarPainelAdmin()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300 border border-slate-700 flex items-center">
                <i class="fa-solid fa-gear mr-1"></i> <span x-text="modoAdmin ? 'Ver App' : 'Painel Admin'"></span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- TELA 1: VISÃO DO CLIENTE -->
        <div x-show="!modoAdmin" class="space-y-4" x-transition>
            
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Fale Diretamente Com</span>
                        <h2 class="text-base font-extrabold text-white" x-text="config.nomeEmpresa"></h2>
                    </div>
                    <span class="text-xs px-2 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">Tectop Secure</span>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                <h3 class="font-bold text-sm text-white flex items-center">
                    <i class="fa-solid fa-message mr-2" :style="'color: ' + config.corPrimaria"></i> Enviar Solicitação / Chamado
                </h3>

                <div>
                    <label class="text-xs text-slate-300 font-medium">Seu Nome</label>
                    <input type="text" x-model="cliente.nome" id="nomeCliente" placeholder="Digite seu nome..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white mt-1 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-300 font-medium">Qual Aparelho / Serviço?</label>
                    <input type="text" x-model="cliente.equipamento" placeholder="Ex: Máquina de Lavar, Geladeira..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white mt-1 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-300 font-medium">Descreva o defeito ou dúvida</label>
                    <textarea x-model="cliente.relato" id="aparelhoCliente" rows="3" placeholder="O que está acontecendo?" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white mt-1 focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <!-- Botão de Anexo de Foto/Vídeo -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <label class="bg-slate-950 border border-slate-800 hover:border-slate-700 p-2.5 rounded-xl text-center cursor-pointer transition">
                        <i class="fa-solid fa-camera text-sm block mb-1" :style="'color: ' + config.corPrimaria"></i>
                        <span class="text-[10px] text-slate-300 font-medium">Enviar Foto / Vídeo</span>
                        <input type="file" accept="image/*,video/*" class="hidden" @change="enviarArquivoReal($event)">
                    </label>

                    <button @click="iniciarChamadaVideo()" class="bg-slate-950 border border-slate-800 hover:border-slate-700 p-2.5 rounded-xl text-center transition">
                        <i class="fa-solid fa-video text-sm block mb-1" :style="'color: ' + config.corPrimaria"></i>
                        <span class="text-[10px] text-slate-300 font-medium">Chamada Ao Vivo</span>
                    </button>
                </div>

                <button @click="enviarSolicitacao()" class="w-full text-slate-950 font-bold py-3 rounded-xl shadow-lg transition text-sm cursor-pointer" :style="'background-color: ' + config.corPrimaria">
                    Enviar Mensagem para <span x-text="config.nomeEmpresa"></span>
                </button>
            </div>

            <!-- HISTÓRICO DE MENSAGENS -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                <h3 class="font-bold text-xs uppercase tracking-wider text-slate-400"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Histórico do Chat</h3>
                <div id="chat-messages" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                    <template x-for="msg in mensagens">
                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1">
                            <div class="flex justify-between text-[10px] text-slate-400">
                                <span class="font-bold" :style="'color: ' + config.corPrimaria" x-text="msg.sender"></span>
                                <span x-text="new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})"></span>
                            </div>
                            <p class="text-xs text-slate-200" x-text="msg.content" x-show="msg.type === 'text'"></p>
                            <template x-if="msg.type === 'image'">
                                <img :src="'/api/media/' + msg.content" class="rounded-lg mt-1 max-h-40 object-cover cursor-pointer" @click="window.open('/api/media/' + msg.content)">
                            </template>
                        </div>
                    </template>
                </div>
            </div>

        </div>

        <!-- TELA 2: PAINEL ADMIN -->
        <div x-show="modoAdmin" class="space-y-4" x-transition>
            
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="font-bold text-sm text-white"><i class="fa-solid fa-sliders mr-2" :style="'color: ' + config.corPrimaria"></i> Painel Admin</h3>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-bold">Ativo</span>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-300 font-medium">Nome da sua Empresa / App</label>
                        <input type="text" x-model="configTemp.nomeEmpresa" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-white mt-1 focus:outline-none">
                    </div>

                    <div>
                        <label class="text-xs text-slate-300 font-medium">Cor Principal do Tema (Hex)</label>
                        <div class="flex space-x-2 mt-1">
                            <input type="color" x-model="configTemp.corPrimaria" class="w-12 h-10 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer p-1">
                            <input type="text" x-model="configTemp.corPrimaria" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 text-sm text-white focus:outline-none">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button @click="guardarConfiguracoes()" class="w-full text-slate-950 font-bold py-3 rounded-xl shadow-lg transition text-sm cursor-pointer" :style="'background-color: ' + configTemp.corPrimaria">
                            Salvar Alterações da Empresa
                        </button>
                    </div>
                </div>

                <!-- Secção de Ficheiros e Mídias no Admin -->
                <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-3 mt-4">
                    <h4 class="text-xs font-bold text-emerald-400"><i class="fa-solid fa-photo-film mr-1"></i> Ficheiros e Mídias dos Clientes:</h4>
                    <div class="space-y-2 max-h-40 overflow-y-auto">
                        <template x-for="msg in mensagens.filter(m => m.type === 'image' || m.type === 'file')">
                            <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex items-center justify-between">
                                <div>
                                    <span class="text-[10px] font-bold text-white" x-text="msg.sender"></span>
                                    <p class="text-[10px] text-slate-400" x-text="new Date(msg.created_at).toLocaleString()"></p>
                                </div>
                                <a :href="'/api/media/' + msg.content" target="_blank" class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/30 hover:bg-emerald-500/30">
                                    Ver Mídia
                                </a>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script>
        function appData() {
            return {
                modoAdmin: false,
                config: {
                    nomeEmpresa: 'Tectop Consertos',
                    corPrimaria: '#10b981'
                },
                configTemp: {
                    nomeEmpresa: 'Tectop Consertos',
                    corPrimaria: '#10b981'
                },
                cliente: {
                    nome: '',
                    equipamento: 'Máquina de Lavar',
                    relato: ''
                },
                mensagens: [],

                initApp() {
                    const salvo = localStorage.getItem('tectop_config_tecnico');
                    if(salvo) {
                        this.config = JSON.parse(salvo);
                        this.configTemp = { ...this.config };
                    }
                    this.carregarMensagens();
                    setInterval(() => this.carregarMensagens(), 4000);
                },

                guardarConfiguracoes() {
                    this.config = { ...this.configTemp };
                    localStorage.setItem('tectop_config_tecnico', JSON.stringify(this.config));
                    this.modoAdmin = false;
                    alert('Configurações atualizadas com sucesso!');
                },

                alternarPainelAdmin() {
                    this.modoAdmin = !this.modoAdmin;
                    if(this.modoAdmin) {
                        this.configTemp = { ...this.config };
                    }
                },

                async carregarMensagens() {
                    try {
                        const res = await fetch('/api/messages?room_id=geral');
                        if(res.ok) {
                            this.mensagens = await res.json();
                        }
                    } catch(e) {
                        console.error("Erro ao sincronizar mensagens", e);
                    }
                },

                async enviarSolicitacao() {
                    if(!this.cliente.nome || !this.cliente.relato) {
                        alert('Por favor, preencha seu nome e a descrição do defeito.');
                        return;
                    }

                    const textoCompleto = `[${this.cliente.equipamento}] ${this.cliente.relato}`;

                    try {
                        const res = await fetch('/api/messages', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                room_id: 'geral',
                                sender: this.cliente.nome,
                                content: textoCompleto,
                                type: 'text'
                            })
                        });

                        const resultado = await res.json();

                        if(res.ok) {
                            this.cliente.relato = '';
                            this.carregarMensagens();
                            alert('Mensagem enviada com sucesso!');
                        } else {
                            alert('Erro do servidor: ' + (resultado.error || 'Desconhecido'));
                        }
                    } catch(err) {
                        alert('Erro de conexão: ' + err.message);
                    }
                },

                async enviarArquivoReal(e) {
                    if(e.target.files.length === 0) return;
                    const file = e.target.files[0];
                    const nomeCliente = this.cliente.nome || 'Cliente';

                    const formData = new FormData();
                    formData.append('room_id', 'geral');
                    formData.append('sender', nomeCliente);
                    formData.append('file', file);

                    try {
                        const res = await fetch('/api/messages', {
                            method: 'POST',
                            body: formData
                        });

                        if(res.ok) {
                            this.carregarMensagens();
                            alert('Ficheiro enviado com sucesso!');
                        } else {
                            alert('Erro ao enviar ficheiro.');
                        }
                    } catch(err) {
                        alert('Erro de conexão ao enviar ficheiro.');
                    }
                },

                iniciarChamadaVideo() {
                    alert('Iniciando ligação de vídeo segura...');
                }
            }
        }
    </script>
</body>
</html>
