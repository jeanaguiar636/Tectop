<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tectop - Chat Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-between" x-data="chatApp()">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg">Tectop - Atendimento</h1>
        <span class="text-xs bg-blue-500 px-2 py-1 rounded">Online (Cloudflare)</span>
    </header>

    <!-- Corpo das Mensagens -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3">
        <template x-for="msg in messages" :key="msg.id">
            <div :class="msg.sender === currentUser ? 'text-right' : 'text-left'">
                <div class="inline-block p-3 rounded-lg max-w-xs md:max-w-md shadow"
                     :class="msg.sender === currentUser ? 'bg-blue-500 text-white' : 'bg-white text-slate-800'">
                    
                    <!-- Texto -->
                    <template x-if="msg.type === 'text'">
                        <p x-text="msg.content"></p>
                    </template>

                    <!-- Imagem -->
                    <template x-if="msg.type === 'image'">
                        <img :src="msg.content" class="rounded max-h-48 object-cover cursor-pointer">
                    </template>

                    <!-- Áudio -->
                    <template x-if="msg.type === 'audio'">
                        <audio controls :src="msg.content" class="w-full"></audio>
                    </template>

                </div>
                <span class="block text-[10px] text-slate-400 mt-1" x-text="msg.sender"></span>
            </div>
        </template>
    </div>

    <!-- Barra de Envio -->
    <div class="bg-white p-3 border-t flex items-center gap-2">
        <!-- Input de Ficheiro (Foto/Áudio) -->
        <input type="file" id="fileInput" class="hidden" @change="uploadFile">
        <button @click="document.getElementById('fileInput').click()" class="bg-slate-200 p-2 rounded-full text-slate-600 hover:bg-slate-300">
            📎
        </button>

        <!-- Input de Texto -->
        <input type="text" x-model="newMessage" @keydown.enter="sendText" placeholder="Escreva a mensagem ou descreva o problema..." class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:border-blue-500">
        
        <button @click="sendText" class="bg-blue-600 text-white px-4 py-2 rounded-full font-medium">Enviar</button>
    </div>

    <script>
        function chatApp() {
            return {
                currentUser: 'Técnico_João',
                roomId: 'sala_cliente_123',
                messages: [],
                newMessage: '',
                async init() {
                    await this.fetchMessages();
                    // Polling leve ou WebSocket para atualizar em tempo real
                    setInterval(() => this.fetchMessages(), 3000);
                },
                async fetchMessages() {
                    const res = await fetch(`https://seu-worker.sua-subconta.workers.dev/api/messages?room_id=${this.roomId}`);
                    this.messages = await res.json();
                },
                async sendText() {
                    if (!this.newMessage.trim()) return;
                    // Lógica para enviar texto via POST para o Worker
                    this.newMessage = '';
                },
                async uploadFile(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("room_id", this.roomId);
                    formData.append("sender", this.currentUser);
                    formData.append("type", file.type.startsWith('image') ? 'image' : 'audio');

                    await fetch(`https://seu-worker.sua-subconta.workers.dev/api/upload`, {
                        method: "POST",
                        body: formData
                    });

                    await this.fetchMessages();
                }
            }
        }
    </script>
</body>
</html>
