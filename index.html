<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tectop - Chat Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-helmet-safety mr-2"></i>Tectop Chat</h1>
        <span id="room-badge" class="text-xs bg-blue-500 px-2 py-1 rounded-full">Sala: Geral</span>
    </header>

    <!-- Corpo das Mensagens -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
        <!-- As mensagens aparecem aqui dinamicamente -->
    </main>

    <!-- Barra de Envio -->
    <footer class="bg-white border-t p-3 flex items-center space-x-2">
        <input type="text" id="sender-input" placeholder="O seu nome" class="border rounded-lg px-2 py-2 text-sm w-1/4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="message-input" placeholder="Escreva uma mensagem..." class="border rounded-lg px-3 py-2 text-sm flex-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
        
        <label class="cursor-pointer bg-gray-200 hover:bg-gray-300 p-2 rounded-lg text-gray-700">
            <i class="fa-solid fa-paperclip"></i>
            <input type="file" id="file-input" class="hidden" onchange="sendFile()">
        </label>

        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </footer>

    <script>
        const API_URL = window.location.origin;
        const currentRoom = "geral";

        async function fetchMessages() {
            try {
                const res = await fetch(`${API_URL}/api/messages?room_id=${currentRoom}`);
                if (!res.ok) return;
                const messages = await res.json();
                const container = document.getElementById("chat-container");
                container.innerHTML = "";

                if (Array.isArray(messages)) {
                    messages.forEach(msg => {
                        const div = document.createElement("div");
                        div.className = "flex flex-col bg-white p-3 rounded-lg shadow-sm max-w-[80%]";
                        
                        let contentHtml = `<p class="text-sm text-gray-800">${escapeHtml(msg.content || '')}</p>`;
                        if (msg.type === "image") {
                            contentHtml = `<img src="${API_URL}/api/media/${msg.content}" class="rounded-lg mt-1 max-h-48 object-cover">`;
                        }

                        div.innerHTML = `
                            <span class="text-xs font-bold text-blue-600 mb-1">${escapeHtml(msg.sender || 'Anónimo')}</span>
                            ${contentHtml}
                            <span class="text-[10px] text-gray-400 mt-1 text-right">${msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</span>
                        `;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                }
            } catch (err) {
                console.error("Erro ao carregar mensagens:", err);
            }
        }

        async function sendMessage() {
            const sender = document.getElementById("sender-input").value.trim() || "Técnico Anónimo";
            const content = document.getElementById("message-input").value.trim();
            if (!content) return;

            await fetch(`${API_URL}/api/messages`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ room_id: currentRoom, sender, content, type: "text" })
            });

            document.getElementById("message-input").value = "";
            fetchMessages();
        }

        async function sendFile() {
            const fileInput = document.getElementById("file-input");
            if (fileInput.files.length === 0) return;

            const sender = document.getElementById("sender-input").value.trim() || "Técnico Anónimo";
            const file = fileInput.files[0];

            const formData = new FormData();
            formData.append("room_id", currentRoom);
            formData.append("sender", sender);
            formData.append("file", file);

            await fetch(`${API_URL}/api/messages`, {
                method: "POST",
                body: formData
            });

            fileInput.value = "";
            fetchMessages();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        setInterval(fetchMessages, 3000);
        fetchMessages();
    </script>
</body>
</html>
